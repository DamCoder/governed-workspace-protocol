name: Release

# Build the downloadable GWP bundles and attach them to a GitHub Release
# whenever a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags needed for version resolution

      - name: Build bundles
        run: scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Create release and attach zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/gwp-*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
